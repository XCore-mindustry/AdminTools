name: Build

on:
  push:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  buildJar:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: No SNAPSHOT dependencies
      run: "! git grep -n -e '-SNAPSHOT' -e 'maven.x-core.org/snapshots' -- '*.gradle.kts' '*.gradle' 'gradle/*.toml'"
    - run: chmod +x gradlew
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        distribution: zulu
        java-version: 17
    - name: Setup Android SDK
      uses: amyu/setup-android@v6.0
      with:
        build-tools-version: 30.0.1
        sdk-version: 26
    - name: Set up PATH
      run: |
        echo "${ANDROID_HOME}/build-tools/30.0.1" >> $GITHUB_PATH
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
    - name: Build mod jar
      # A release leaves out the dev harness.
      run: ./gradlew build ${{ github.event_name == 'release' && '-Prelease' || '' }}
    - name: Upload built jar file
      uses: actions/upload-artifact@v7
      with:
        name: ${{ github.event.repository.name }}
        path: build/libs/${{ github.event.repository.name }}.jar
    - name: Attach jar to the release
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "${{ github.event.release.tag_name }}" build/libs/${{ github.event.repository.name }}.jar --clobber
